AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Generic draft-scoped outbound SMTP notification worker.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - test
      - production
  CommerceNotificationRequestsTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedPattern: '^/zoolanding/(test|production)/topics/commerce-notification-requests-arn$'
    AllowedValues:
      - /zoolanding/test/topics/commerce-notification-requests-arn
      - /zoolanding/production/topics/commerce-notification-requests-arn
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_.-]+$'
  ConfigRegistryTableName:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedPattern: '^/zoolanding/(test|production)/config/registry-table-name$'
    AllowedValues:
      - /zoolanding/test/config/registry-table-name
      - /zoolanding/production/config/registry-table-name
  ConfigPayloadsBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedPattern: '^/zoolanding/(test|production)/config/payload-bucket-name$'
    AllowedValues:
      - /zoolanding/test/config/payload-bucket-name
      - /zoolanding/production/config/payload-bucket-name
  IntegrationsApiId:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedPattern: '^/zoolanding/(test|production)/services/integrations/api-id$'
    AllowedValues:
      - /zoolanding/test/services/integrations/api-id
      - /zoolanding/production/services/integrations/api-id

Mappings:
  IntegrationsStageByEnvironment:
    test:
      Stage: test
    production:
      Stage: production

Resources:
  DeliveryLedger:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - NotificationDeadLetterQueue
            - Arn
        maxReceiveCount: 5

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: NotificationQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CommerceNotificationRequestsOnly
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
                - NotificationQueue
                - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Ref: CommerceNotificationRequestsTopicArn
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId

  CommerceNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: CommerceNotificationRequestsTopicArn
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
          - NotificationQueue
          - Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageBody
      FilterPolicy:
        eventType:
          - notification.requested.v1

  SmtpDeliveryWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/zoolanding-notifications-${EnvironmentName}-smtp-delivery
      RetentionInDays: 90

  SmtpDeliveryWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: smtp-delivery-worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - NotificationQueue
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/zoolanding-notifications-${EnvironmentName}-smtp-delivery:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  Fn::GetAtt:
                    - DeliveryLedger
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/_manifest.json
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/notification-policies.json
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/*/*/notifications/smtp/*-??????
                  - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/*/*/notifications/recipients/*/*/*-??????
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntegrationsApiId}/${IntegrationsStage}/POST/internal/v1/integrations/connection-resolve
                    - IntegrationsStage:
                        Fn::FindInMap:
                          - IntegrationsStageByEnvironment
                          - Ref: EnvironmentName
                          - Stage
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Zoolanding/Notifications

  SmtpDeliveryWorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - SmtpDeliveryWorkerLogGroup
    Properties:
      FunctionName:
        Fn::Sub: zoolanding-notifications-${EnvironmentName}-smtp-delivery
      Runtime: python3.13
      Architectures:
        - x86_64
      CodeUri: src/
      Handler: handlers.smtp_delivery_worker.lambda_handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      Role:
        Fn::GetAtt:
          - SmtpDeliveryWorkerRole
          - Arn
      Environment:
        Variables:
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
          DELIVERY_LEDGER_TABLE_NAME:
            Ref: DeliveryLedger
          CONFIG_REGISTRY_TABLE_NAME:
            Ref: ConfigRegistryTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          INTEGRATIONS_API_ID:
            Ref: IntegrationsApiId
          INTEGRATIONS_URL_SUFFIX:
            Ref: AWS::URLSuffix
      Events:
        NotificationQueue:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - NotificationQueue
                - Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2

  SmtpWorkerRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/services/notifications/smtp-worker-role-arn
      Type: String
      Value:
        Fn::GetAtt:
          - SmtpDeliveryWorkerRole
          - Arn
      Description: Exact notifications SMTP worker role ARN for internal caller allowlists.
      Tier: Standard

  NotificationQueueArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/queues/notification-requests-arn
      Type: String
      Value:
        Fn::GetAtt:
          - NotificationQueue
          - Arn
      Description: Exact outbound notification request queue ARN.
      Tier: Standard

  DeliveryLedgerNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/tables/notifications-delivery-ledger-name
      Type: String
      Value:
        Ref: DeliveryLedger
      Description: Exact technical notification delivery ledger table name.
      Tier: Standard

  QueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Visible notification requests exceed the bounded worker backlog.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - NotificationQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Notifications DLQ contains a message.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - NotificationDeadLetterQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest notification request exceeds five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - NotificationQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  DlqAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest dead-lettered notification exceeds five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - NotificationDeadLetterQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Notification worker reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: SmtpDeliveryWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Notification worker is throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: SmtpDeliveryWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  SmtpCircuitAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SMTP authentication or quota circuit opened.
      Namespace: Zoolanding/Notifications
      MetricName: CircuitOpen
      Dimensions:
        - Name: Environment
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  Smtp2GoAuthenticationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SMTP2GO rejected SMTP authentication.
      Namespace: Zoolanding/Notifications
      MetricName: Smtp2GoAuthenticationRejected
      Dimensions:
        - Name: Environment
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  Smtp2GoQuotaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SMTP2GO rejected a message because account quota is exhausted.
      Namespace: Zoolanding/Notifications
      MetricName: Smtp2GoQuotaRejected
      Dimensions:
        - Name: Environment
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  Smtp2GoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SMTP2GO rejected a message for a documented rate or connection limit.
      Namespace: Zoolanding/Notifications
      MetricName: Smtp2GoThrottleRejected
      Dimensions:
        - Name: Environment
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

  TestLiveMismatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A notification event crossed the test and production boundary.
      Namespace: Zoolanding/Notifications
      MetricName: TestLiveMismatch
      Dimensions:
        - Name: Environment
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

Outputs:
  NotificationQueueArn:
    Value:
      Fn::GetAtt:
        - NotificationQueue
        - Arn
  DeliveryLedgerName:
    Value:
      Ref: DeliveryLedger
  SmtpWorkerRoleArn:
    Value:
      Fn::GetAtt:
        - SmtpDeliveryWorkerRole
        - Arn
  SmtpWorkerRoleArnParameterName:
    Value:
      Ref: SmtpWorkerRoleArnParameter
  NotificationQueueArnParameterName:
    Value:
      Ref: NotificationQueueArnParameter
  DeliveryLedgerNameParameterName:
    Value:
      Ref: DeliveryLedgerNameParameter
